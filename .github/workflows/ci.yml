name: Verificações
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: checks
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      R_LIBS_USER: /tmp/foundry-ci/r-library
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Preparar ferramentas no runner descartável
        env:
          HOME: /tmp/foundry-ci
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck shfmt bats fzf zoxide curl direnv eza
          bash scripts/ci-setup.sh
      - name: Preparar runtimes para os cinco cenários opcionais
        if: github.event_name == 'workflow_dispatch'
        env:
          HOME: /tmp/foundry-ci
        run: |
          sudo apt-get install -y r-base r-base-dev nodejs
          umask 077
          mkdir -p "$R_LIBS_USER" "$HOME/quarto"
          curl --fail --location --silent --show-error --output /tmp/renv-1.3.1.tar.gz https://api.github.com/repos/rstudio/renv/tarball/v1.3.1
          echo '575d0b1cb4154b779eb1ebc054cb1abb007e021f084b7b19dc2a57036bfbba61  /tmp/renv-1.3.1.tar.gz' | sha256sum --check
          R CMD INSTALL --library="$R_LIBS_USER" /tmp/renv-1.3.1.tar.gz
          curl --fail --location --silent --show-error --output /tmp/quarto-1.10.19.tar.gz https://github.com/quarto-dev/quarto-cli/releases/download/v1.10.19/quarto-1.10.19-linux-amd64.tar.gz
          echo '8e38c2b2df6a6dbd369ea16e15acded6894545258d13a02f777f81ad18fd7973  /tmp/quarto-1.10.19.tar.gz' | sha256sum --check
          tar -xzf /tmp/quarto-1.10.19.tar.gz --strip-components=1 -C "$HOME/quarto"
          echo "$HOME/quarto/bin" >> "$GITHUB_PATH"
          "$HOME/quarto/bin/quarto" --version
          Rscript --vanilla -e 'stopifnot(requireNamespace("renv", quietly=TRUE)); cat(as.character(packageVersion("renv")), "\n")'
      - name: Testes determinísticos sem downloads
        env:
          HOME: /tmp/foundry-ci
        run: |
          # Priorizar o Node do apt sobre o executável pré-instalado no runner.
          export PATH="$HOME/.local/bin:/usr/bin:$PATH"
          command -v starship
          set -o pipefail
          bash scripts/check.sh | tee /tmp/foundry-checks.log
      - name: Exigir cobertura dos cenários opcionais no disparo manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          if grep -E '^ok .* # skip' /tmp/foundry-checks.log; then
            echo 'A execução completa não pode pular testes.' >&2
            exit 1
          fi
  containers:
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu, adapter: apt, image: 'ubuntu:24.04'}
          - {name: debian, adapter: apt, image: 'debian:13-slim'}
          - {name: fedora, adapter: dnf, image: 'fedora:44'}
          - {name: arch, adapter: pacman, image: 'archlinux:base'}
          - {name: opensuse, adapter: zypper, image: 'opensuse/leap:16.0'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Build com downloads explícitos
        run: docker build -f tests/Containerfile --build-arg 'BASE_IMAGE=${{ matrix.image }}' --build-arg 'ADAPTER=${{ matrix.adapter }}' -t 'foundry-test:${{ matrix.name }}' .
      - name: Suíte sem rede
        run: docker run --rm --network none 'foundry-test:${{ matrix.name }}'
  online-smoke:
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Dependências no runner descartável
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck shfmt bats
      - name: Downloads e instalações em HOME temporária
        run: bash scripts/online-smoke.sh
